# Template for GitHub Actions.
#
# GitHub only reads workflows from .github/workflows/ at the repo root, so to
# build a GHCR image for this subfolder, copy this file to:
#
#   .github/workflows/wiz-bulb-api.yml
#
# and adjust nothing else. The image becomes:
#
#   ghcr.io/<owner>/shellyscripts-wiz-bulb-api:latest

name: wiz-bulb-api

on:
  push:
    branches: [main]
    tags: ["wiz-bulb-api-v*"]
    paths: ["wiz-bulb-api/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shellyscripts-wiz-bulb-api
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./wiz-bulb-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
