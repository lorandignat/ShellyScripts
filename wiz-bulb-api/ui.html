<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Lights</title>
<style>
  :root {
    --bg: #0c0e12;
    --bg-2: #11141a;
    --card: #171b22;
    --card-hover: #1c212a;
    --line: #262c36;
    --line-soft: #1f242c;
    --text: #eef2f7;
    --muted: #8b95a4;
    --muted-2: #5f6875;
    --green: #3ddc97;
    --amber: #f5b544;
    --grey: #6a7381;
    --accent: #5aa9ff;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 500px at 15% -10%, #16202c 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #1a1620 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 5;
    padding: 18px 22px 14px;
    background: rgba(12, 14, 18, .82);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line-soft);
  }
  .bar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    max-width: 1480px; margin: 0 auto;
  }
  h1 {
    margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -.2px;
    display: flex; align-items: center; gap: 10px;
  }
  h1 svg { color: var(--amber); }
  .search {
    margin-left: auto; position: relative; min-width: 220px;
  }
  .search input {
    width: 100%; padding: 9px 12px 9px 34px;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus {
    outline: none; border-color: #3a4658;
    box-shadow: 0 0 0 3px rgba(90, 169, 255, .12);
  }
  .search svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted-2); pointer-events: none;
  }
  .chips {
    display: flex; gap: 8px; flex-wrap: wrap;
    max-width: 1480px; margin: 12px auto 0;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 11px; border-radius: 999px;
    background: var(--bg-2); border: 1px solid var(--line);
    color: var(--muted); font-size: 13px; font-weight: 550;
    cursor: pointer; user-select: none;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip:hover { border-color: #36404f; color: var(--text); }
  .chip.active { border-color: #3c4b60; background: #1a212b; color: var(--text); }
  .chip b { color: var(--text); font-weight: 650; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--grey);
    flex: none;
  }
  .dot.ok { background: var(--green); }
  .dot.warn { background: var(--amber); }

  /* ---- grid ---- */
  main {
    max-width: 1480px; margin: 0 auto;
    padding: 20px 22px 60px;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }

  /* ---- card ---- */
  .card {
    position: relative;
    display: grid;
    grid-template-columns: 58px 1fr auto;
    align-items: center; gap: 15px;
    padding: 16px 16px 16px 17px;
    background: linear-gradient(180deg, var(--card), #14171d);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    transition: background .15s, border-color .15s, transform .12s;
  }
  .card:hover { background: var(--card-hover); border-color: #303845; }
  .card.offline { opacity: .5; }
  .card.offline:hover { transform: none; }

  .orb {
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--orb, #232833);
    border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: inset 0 -8px 16px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .14);
    transition: background .3s;
  }

  .info { min-width: 0; }
  .name {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 650; letter-spacing: -.1px;
  }
  .model {
    margin-top: 2px;
    color: var(--muted); font-size: 12.5px;
    overflow-wrap: anywhere;
  }
  .addr {
    margin-top: 1px;
    color: var(--muted-2); font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .state {
    margin-top: 7px;
    display: flex; align-items: center; gap: 7px;
    color: var(--muted); font-size: 12.5px;
  }
  .state .dot { width: 6px; height: 6px; }
  .state.warn { color: var(--amber); }
  .state.ok { color: var(--green); }
  .state .dim { color: var(--muted-2); }

  .power {
    display: grid; place-items: center; gap: 4px;
    width: 68px; padding: 10px 0 8px;
    background: #1d232c; color: var(--muted);
    border: 1px solid var(--line); border-radius: 13px;
    font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .2px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  .power svg { width: 20px; height: 20px; }
  .power:hover { border-color: #3a4453; color: var(--text); }
  .power:active { transform: scale(.96); }
  .power.on {
    background: rgba(61, 220, 151, .12);
    border-color: rgba(61, 220, 151, .38);
    color: var(--green);
  }
  .power:disabled { opacity: .45; cursor: default; }

  /* ---- empty ---- */
  .empty {
    grid-column: 1 / -1; text-align: center; padding: 80px 20px;
    color: var(--muted); line-height: 1.8;
  }
  .empty code {
    background: var(--bg-2); border: 1px solid var(--line);
    padding: 2px 7px; border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
  }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 16px);
    max-width: min(90vw, 560px);
    padding: 11px 16px;
    background: #2a1417; border: 1px solid #5b2830; color: #ffc9ce;
    border-radius: 11px; font-size: 13px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    header { padding: 16px 16px 12px; }
    main { padding: 16px 16px 50px; grid-template-columns: 1fr; }
    .search { width: 100%; margin-left: 0; }
    .search input { width: 100%; }
    .card { grid-template-columns: 52px 1fr auto; gap: 13px; padding: 14px; }
    .orb { width: 52px; height: 52px; }
    .power { width: 60px; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M9 18h6M10 21h4"/>
        <path d="M12 3a6 6 0 0 0-3.3 10.9c.5.4.8 1 .8 1.6V16h5v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3Z"/>
      </svg>
      Lights
    </h1>

    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
      </svg>
      <input id="filter" type="search" placeholder="Search name, model or IP"
             autocomplete="off" spellcheck="false">
    </label>
  </div>

  <div class="chips" id="chips">
    <span class="chip active" data-filter="all">
      <span class="dot ok"></span><b id="n-ok">0</b> connected
    </span>
    <span class="chip" data-filter="warn">
      <span class="dot warn"></span><b id="n-warn">0</b> no response
    </span>
    <span class="chip" data-filter="offline">
      <span class="dot"></span><b id="n-off">0</b> offline
    </span>
  </div>
</header>

<main id="grid"></main>
<div id="toast" role="status"></div>

<script>
"use strict";

const state = {
  bulbs: [],
  text: "",
  statusFilter: "all",
  pending: new Set(),
  token: localStorage.getItem("wiz-token") || "",
  timer: null,
  loading: false
};

const grid = document.getElementById("grid");
const toast = document.getElementById("toast");
const filterInput = document.getElementById("filter");
const counts = {
  ok: document.getElementById("n-ok"),
  warn: document.getElementById("n-warn"),
  off: document.getElementById("n-off")
};

// ---- api -------------------------------------------------------------------

async function api(path, options, retried) {
  const opts = Object.assign({}, options);
  opts.headers = Object.assign({}, opts.headers);
  if (state.token) opts.headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(path, opts);
  if (res.status === 401 && !retried) {
    const entered = prompt("This API needs a token (WIZ_API_TOKEN):");
    if (entered && entered.trim()) {
      state.token = entered.trim();
      localStorage.setItem("wiz-token", state.token);
      return api(path, options, true);
    }
  }
  return res;
}

function toastError(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toast._hide);
  toast._hide = setTimeout(() => toast.classList.remove("show"), 4000);
}

// ---- colour ----------------------------------------------------------------

function kelvinToRgb(kelvin) {
  const t = Math.max(1000, Math.min(12000, kelvin)) / 100;
  let r, g, b;
  if (t <= 66) {
    r = 255;
    g = 99.47 * Math.log(t) - 161.12;
    b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04;
  } else {
    r = 329.7 * Math.pow(t - 60, -0.1332);
    g = 288.12 * Math.pow(t - 60, -0.0755);
    b = 255;
  }
  const c = v => Math.max(0, Math.min(255, Math.round(v)));
  return [c(r), c(g), c(b)];
}

function orbColor(bulb) {
  if (!bulb.present) return "#1d222b";
  if (!bulb.state) return "#232833";
  let rgb;
  if (bulb.r != null && bulb.g != null && bulb.b != null &&
      (bulb.r + bulb.g + bulb.b) > 0) {
    rgb = [bulb.r, bulb.g, bulb.b];
  } else if (bulb.temp != null) {
    rgb = kelvinToRgb(bulb.temp);
  } else if (bulb.w != null) {
    rgb = [bulb.w, Math.round(bulb.w * .92), Math.round(bulb.w * .78)];
  } else if (bulb.c != null) {
    rgb = [Math.round(bulb.c * .88), Math.round(bulb.c * .94), bulb.c];
  } else {
    rgb = [255, 214, 160];
  }
  const dim = (bulb.dimming == null ? 100 : Math.max(15, bulb.dimming)) / 100;
  const mix = v => Math.round(v * dim);
  return `rgb(${rgb.map(mix).join(",")})`;
}

// ---- status ----------------------------------------------------------------

function statusOf(bulb) {
  if (!bulb.present) return { key: "offline", label: "Offline", cls: "" };
  if (!bulb.responsive) return { key: "warn", label: "No response", cls: "warn" };
  return { key: "ok", label: "Connected", cls: "ok" };
}

function nameOf(bulb) {
  return "WiZ " + bulb.mac.slice(-6);
}

// ---- render ----------------------------------------------------------------

function render() {
  const text = state.text.trim().toLowerCase();
  let bulbs = state.bulbs.filter(b =>
    !text || `${nameOf(b)} ${b.mac} ${b.ip} ${b.model || ""}`.toLowerCase().includes(text));

  if (state.statusFilter !== "all") {
    bulbs = bulbs.filter(b => statusOf(b).key === state.statusFilter);
  }

  const rank = b => statusOf(b).key === "ok" ? 0 : statusOf(b).key === "warn" ? 1 : 2;
  bulbs = bulbs.slice().sort((a, b) =>
    rank(a) - rank(b) ||
    a.ip.localeCompare(b.ip, undefined, { numeric: true }));

  const total = state.bulbs;
  counts.ok.textContent = total.filter(b => statusOf(b).key === "ok").length;
  counts.warn.textContent = total.filter(b => statusOf(b).key === "warn").length;
  counts.off.textContent = total.filter(b => statusOf(b).key === "offline").length;

  grid.replaceChildren();

  if (!bulbs.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = total.length
      ? "Nothing matches this view."
      : "No bulbs found yet.<br>Check <code>WIZ_SUBNET</code> and that the service can reach UDP 38899.";
    grid.append(empty);
    return;
  }

  for (const bulb of bulbs) grid.append(card(bulb));
}

const POWER_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.9" stroke-linecap="round">' +
  '<path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>';

function card(bulb) {
  const status = statusOf(bulb);
  const el = document.createElement("article");
  el.className = "card" + (status.key === "offline" ? " offline" : "");

  const orb = document.createElement("div");
  orb.className = "orb";
  orb.style.setProperty("--orb", orbColor(bulb));

  const info = document.createElement("div");
  info.className = "info";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = nameOf(bulb);

  const model = document.createElement("div");
  model.className = "model";
  model.textContent = bulb.model || "WiZ bulb";

  const addr = document.createElement("div");
  addr.className = "addr";
  addr.textContent = bulb.ip || "no address";

  const line = document.createElement("div");
  line.className = "state " + status.cls;
  const dot = document.createElement("span");
  dot.className = "dot " + status.cls;
  line.append(dot, document.createTextNode(status.label));

  if (status.key === "ok") {
    const detail = document.createElement("span");
    detail.className = "dim";
    detail.textContent = bulb.state
      ? "· on" + (bulb.dimming != null ? ` ${bulb.dimming}%` : "")
      : "· off";
    line.append(document.createTextNode(" "), detail);
  } else if (status.key === "warn" && bulb.last_response_s != null) {
    const detail = document.createElement("span");
    detail.className = "dim";
    detail.textContent = `· last reply ${bulb.last_response_s}s ago`;
    line.append(document.createTextNode(" "), detail);
  }

  info.append(name, model, addr, line);

  const button = document.createElement("button");
  button.className = "power" + (bulb.state && bulb.present ? " on" : "");
  button.disabled = !bulb.present || state.pending.has(bulb.mac);
  button.innerHTML = POWER_SVG + "<span>" + (bulb.state ? "On" : "Off") + "</span>";
  button.setAttribute("aria-label", bulb.state ? "Turn off" : "Turn on");
  button.addEventListener("click", () => toggle(bulb));

  el.append(orb, info, button);
  return el;
}

// ---- data ------------------------------------------------------------------

async function load() {
  if (state.loading) return;
  state.loading = true;
  try {
    const res = await api("/bulbs?live=1");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const previous = new Map(state.bulbs.map(b => [b.mac, b]));

    state.bulbs = (data.bulbs || []).map(next => {
      const old = previous.get(next.mac);
      // Keep the optimistic state while a press is in flight.
      if (old && state.pending.has(next.mac)) next.state = old.state;
      return next;
    });
    render();
  } catch (err) {
    toastError("Could not load lights: " + err.message);
  } finally {
    state.loading = false;
    schedule();
  }
}

function schedule() {
  clearTimeout(state.timer);
  if (document.hidden) return;
  state.timer = setTimeout(load, 5000);
}

async function toggle(bulb) {
  if (state.pending.has(bulb.mac) || !bulb.present) return;

  const desired = !bulb.state;
  bulb.state = desired;                  // optimistic, icon changes immediately
  state.pending.add(bulb.mac);
  render();

  try {
    const res = await api(`/bulb/${encodeURIComponent(bulb.mac)}/toggle`, { method: "POST" });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(res.status === 503 ? "no response from the bulb" : "HTTP " + res.status);
    }
    bulb.state = body.state;
  } catch (err) {
    bulb.state = !desired;               // revert
    toastError("Could not switch " + nameOf(bulb) + ": " + err.message);
  } finally {
    state.pending.delete(bulb.mac);
    render();
  }
}

// ---- events ----------------------------------------------------------------

filterInput.addEventListener("input", () => {
  state.text = filterInput.value;
  render();
});

document.getElementById("chips").addEventListener("click", ev => {
  const chip = ev.target.closest(".chip");
  if (!chip) return;
  state.statusFilter = chip.dataset.filter;
  for (const c of document.querySelectorAll(".chip")) {
    c.classList.toggle("active", c === chip);
  }
  render();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearTimeout(state.timer);
  else load();
});

load();
</script>
</body>
</html>
